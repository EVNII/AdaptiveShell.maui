name: UI Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true

# Mac Catalyst 不在 CI 跑:Mac2 driver 需要辅助功能授权与已注册 app,
# 在托管 runner 上不稳定,仅保留本地运行(见 Tests/AdaptiveShell.UITests/run-uitest.sh)

jobs:
  # Android 跑在 ubuntu:macos-15 标准 runner(M1/M2)不支持嵌套虚拟化,
  # Android 模拟器 HVF 加速不可用;ubuntu runner 有 KVM
  uitest-android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: pixel_6      # 411dp 宽 -> 底部导航
            form: compact
          - profile: pixel_tablet # 宽屏 -> NavigationRail
            form: wide
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        # AVD userdata 需要 7.3G;去掉用不到的预装工具链腾空间。
        # 注意必须在 setup-dotnet 之前(它会往 tool-cache 里装 SDK)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: false
          dotnet: false
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install MAUI workloads
        run: dotnet workload install maui-android

      - name: Install Appium
        run: |
          npm i -g appium
          appium driver install uiautomator2

      - name: Build example app
        # TargetFrameworks 单 TFM 覆盖:否则 restore 会要求 ios/maccatalyst workload;
        # EmbedAssembliesIntoApk:Debug 默认 fast-deploy 包不含程序集,装到模拟器后启动即崩
        run: dotnet build Example/ExampleAShellApp/ExampleAShellApp.csproj -c Debug -p:TargetFrameworks=net10.0-android -p:EmbedAssembliesIntoApk=true

      - name: Run UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          script: |
            npx appium > appium.log 2>&1 &
            # 注意:该 action 把 script 逐行交给独立 sh -c 执行,export 不跨行保留,
            # 环境变量必须内联在命令前
            UITEST_PLATFORM=android UITEST_FORM=${{ matrix.form }} UITEST_APP_PATH="$GITHUB_WORKSPACE/Example/ExampleAShellApp/bin/Debug/net10.0-android/com.companyname.exampleashellapp-Signed.apk" dotnet test Tests/AdaptiveShell.UITests/AdaptiveShell.UITests.csproj

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: uitest-android-${{ matrix.form }}
          path: |
            TestResults/screenshots
            appium.log
          if-no-files-found: ignore

  uitest-ios:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Select latest Xcode
        # 最新 maui-ios workload 需要较新的 iOS SDK,runner 默认 Xcode 可能偏旧。
        # 必须先 realpath 再选:macios 的已知缺陷是 Xcode 为符号链接时
        # actool 查找失败(exit 16384);切换后 runFirstLaunch 装组件
        run: |
          XCODE_APP="$(for app in /Applications/Xcode*.app; do realpath "$app"; done | sort -uV | tail -1)"
          echo "Selecting $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          sudo xcodebuild -license accept || true
          xcodebuild -runFirstLaunch
          xcodebuild -version

      - name: Install MAUI workloads
        run: dotnet workload install maui-ios

      - name: Install Appium
        run: |
          npm i -g appium
          appium driver install xcuitest

      - name: Boot simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          for runtimes in data['devices'].values():
              for d in runtimes:
                  if d['name'] == 'iPhone 16':
                      print(d['udid']); sys.exit(0)
          ")
          [ -n "$UDID" ] || { echo 'iPhone 16 simulator not found'; exit 1; }
          xcrun simctl boot "$UDID" || true
          echo "UDID=$UDID" >> "$GITHUB_ENV"

      - name: Build example app
        # runner 最新 Xcode(26.3)的 SDK 低于 ios26.5 pack 要求(26.5),
        # SdkOnly 链接可绕过 MT0180(库用到的 UITab 等 API 在 26.3 SDK 内)
        run: dotnet build Example/ExampleAShellApp/ExampleAShellApp.csproj -c Debug -p:TargetFrameworks=net10.0-ios26.5 -p:RuntimeIdentifier=iossimulator-arm64 -p:MtouchLink=SdkOnly

      - name: Run UI tests
        run: |
          npx appium > appium.log 2>&1 &
          export UITEST_PLATFORM=ios UITEST_FORM=compact
          export UITEST_DEVICE_NAME="iPhone 16" UITEST_DEVICE_UDID="$UDID"
          export UITEST_APP_PATH="$GITHUB_WORKSPACE/Example/ExampleAShellApp/bin/Debug/net10.0-ios26.5/iossimulator-arm64/ExampleAShellApp.app"
          dotnet test Tests/AdaptiveShell.UITests/AdaptiveShell.UITests.csproj

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: uitest-ios
          path: |
            TestResults/screenshots
            appium.log
          if-no-files-found: ignore

  uitest-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install MAUI workloads
        run: dotnet workload install maui-windows

      - name: Install Appium
        run: |
          npm i -g appium
          appium driver install --source npm appium-windows-driver

      - name: Build example app
        run: dotnet build Example/ExampleAShellApp/ExampleAShellApp.csproj -c Debug -p:TargetFrameworks=net10.0-windows10.0.19041.0

      - name: Run UI tests
        shell: pwsh
        run: |
          # npx/appium 是 .cmd shim,Start-Process 不能直接起,要走 cmd.exe
          Start-Process cmd.exe -ArgumentList '/c','npx --yes appium > appium.log 2>&1' `
            -WindowStyle Hidden
          Start-Sleep -Seconds 10
          $exe = Get-ChildItem "Example/ExampleAShellApp/bin/Debug/net10.0-windows10.0.19041.0" `
            -Filter ExampleAShellApp.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw "ExampleAShellApp.exe not found" }
          $env:UITEST_PLATFORM = "windows"
          $env:UITEST_APP_PATH = $exe.FullName
          dotnet test Tests/AdaptiveShell.UITests/AdaptiveShell.UITests.csproj

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: uitest-windows
          path: |
            TestResults/screenshots
            appium.log
          if-no-files-found: ignore
