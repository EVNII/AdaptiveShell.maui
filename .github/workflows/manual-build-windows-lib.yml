name: Manual build Windows lib

on:
  workflow_dispatch:

jobs:
  build-windows-lib:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install MAUI workloads
        run: dotnet workload install maui-windows
      - name: Build Windows (Release)
        run: dotnet build AdaptiveShell.csproj -c Release -p:TargetFrameworks=net10.0-windows10.0.19041.0
      - uses: actions/upload-artifact@v4
        with:
          name: windows-lib
          path: |
            bin/Release/net10.0-windows10.0.19041.0/AdaptiveShell.dll
            bin/Release/net10.0-windows10.0.19041.0/AdaptiveShell.xml
          retention-days: 3
