name: iOS18 Simctl List Semantics Proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simctl-list-proof:
    runs-on: macos-15
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: Checkout exact CLI-evidence source
        uses: actions/checkout@v4
      - name: Capture read-only official CLI semantics
        timeout-minutes: 2
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime as dt
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import signal
          import subprocess
          import sys
          import time

          EXPECTED_BRANCH = 'codex/ios18-simctl-list-proof'
          EXPECTED_WORKFLOW = 'iOS18 Simctl List Semantics Proof'
          DEVELOPER = '/Applications/Xcode_16.4.app/Contents/Developer'
          OUT = Path('TestResults/simctl-list-proof')

          def utc():
              return dt.datetime.now(dt.timezone.utc).isoformat()

          def need(condition, message):
              if not condition:
                  raise ValueError(message)

          def sha(data):
              return hashlib.sha256(data).hexdigest()

          def write_new(path, data):
              with path.open('xb') as stream:
                  stream.write(data)
              return {'path': str(path), 'bytes': len(data), 'sha256': sha(data)}

          def device_rows(response):
              need(isinstance(response, dict) and isinstance(response.get('devices'), dict),
                   'Native devices JSON must contain the actual runtime/device groups')
              rows = []
              for runtime, entries in response['devices'].items():
                  need(isinstance(runtime, str) and isinstance(entries, list), 'Invalid native device group')
                  for device in entries:
                      need(isinstance(device, dict) and isinstance(device.get('udid'), str)
                           and re.fullmatch(r'[0-9a-fA-F]{8}(?:-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}', device['udid']),
                           'Missing canonical real native UDID')
                      rows.append((runtime, device))
              ids = [device['udid'].upper() for _, device in rows]
              need(len(ids) == len(set(ids)), 'Native JSON repeats a device identity')
              return rows

          def main():
              expected = {'GITHUB_ACTIONS': 'true', 'RUNNER_ENVIRONMENT': 'github-hosted',
                          'RUNNER_OS': 'macOS', 'GITHUB_REPOSITORY': 'EVNII/AdaptiveShell.maui',
                          'GITHUB_JOB': 'simctl-list-proof', 'GITHUB_EVENT_NAME': 'workflow_dispatch',
                          'GITHUB_REF_NAME': EXPECTED_BRANCH, 'GITHUB_WORKFLOW': EXPECTED_WORKFLOW,
                          'DEVELOPER_DIR': DEVELOPER}
              need(sys.platform == 'darwin' and all(os.environ.get(k) == v for k, v in expected.items()),
                   'Only the explicit owned hosted CLI-evidence job is allowed')
              head = os.environ.get('GITHUB_SHA', '')
              need(re.fullmatch(r'[0-9a-f]{40}', head) and os.environ.get('GITHUB_WORKFLOW_SHA') == head,
                   'Exact workflow/source SHA is required')
              run_id, attempt = os.environ.get('GITHUB_RUN_ID', ''), os.environ.get('GITHUB_RUN_ATTEMPT', '')
              need(re.fullmatch(r'[1-9][0-9]*', run_id) and re.fullmatch(r'[1-9][0-9]*', attempt),
                   'Original run/attempt identity is required')
              root = Path(os.environ['GITHUB_WORKSPACE']).resolve()
              need(Path.cwd().resolve() == root and Path(DEVELOPER).is_dir(), 'Exact source and Xcode16.4 must exist')
              workflow = root / '.github/workflows/release-uitest.yml'
              need(workflow.is_file() and not workflow.is_symlink(), 'Missing original workflow')
              need(not OUT.is_symlink() and not OUT.parent.is_symlink(), 'Evidence directory must not be a symlink')
              OUT.mkdir(parents=True, exist_ok=False)
              started = time.monotonic()
              deadline = started + 60
              proof = {'schema': 1, 'status': 'capture_error', 'ui_acceptance': False,
                       'inventory_optimization_proven': False,
                       'scope': 'One read-only Xcode16.4 CLI semantics observation; no AUT, boot, UI test, settings, or service control',
                       'run_id': int(run_id), 'run_attempt': int(attempt), 'head_sha': head,
                       'branch': EXPECTED_BRANCH, 'workflow': EXPECTED_WORKFLOW,
                       'workflow_sha256': sha(workflow.read_bytes()), 'developer_dir': DEVELOPER,
                       'started_utc': utc(), 'whole_budget_seconds': 60, 'client_budget_seconds': 10,
                       'commands': []}

              def remaining():
                  value = deadline - time.monotonic()
                  need(value > 0, 'Shared 60-second diagnostic deadline expired')
                  return value

              def native(argv, label):
                  # Every child owns a new group; cleanup never targets existing services.
                  begin = time.monotonic()
                  client_deadline = min(deadline, begin + 10)
                  row = {'label': label, 'argv': argv, 'started_utc': utc(),
                         'allotted_timeout_seconds': min(10, remaining()), 'start_new_session': True}
                  proof['commands'].append(row)
                  stdout, stderr = OUT / (label + '.stdout'), OUT / (label + '.stderr')
                  child = None
                  try:
                      with stdout.open('xb') as out, stderr.open('xb') as err:
                          child = subprocess.Popen(argv, cwd=root, stdout=out, stderr=err,
                                                   start_new_session=True,
                                                   env={**os.environ, 'LC_ALL': 'C', 'LANG': 'C'})
                          row.update(pid=child.pid, pgid=os.getpgid(child.pid), owner_uid=os.getuid())
                          need(row['pgid'] == child.pid and child.pid != os.getpgrp(), 'New client group is not owned')
                          budget = client_deadline - time.monotonic()
                          need(budget > 0, 'Native client exhausted its bound before waiting')
                          try:
                              child.wait(timeout=budget)
                          except subprocess.TimeoutExpired:
                              row['timed_out'] = True
                              raise
                          row['exit_code'] = child.returncode
                          need(child.returncode == 0, 'Original read-only command failed: ' + label)
                  finally:
                      if child is not None and child.poll() is None:
                          try:
                              need(os.getpgid(child.pid) == child.pid and child.pid != os.getpgrp(),
                                   'Refusing cleanup of an unowned client group')
                              os.killpg(child.pid, signal.SIGKILL)
                              row['owned_client_group_killed'] = True
                          except ProcessLookupError:
                              pass
                          # Reap only this child, and never extend the shared clock.
                          if time.monotonic() < deadline:
                              try:
                                  child.wait(timeout=min(1, deadline - time.monotonic()))
                              except subprocess.TimeoutExpired:
                                  row['reap_deadline_expired'] = True
                      row.update(finished_utc=utc(), elapsed_seconds=time.monotonic() - begin,
                                 exit_code=None if child is None else child.poll())
                      for name, path in [('stdout', stdout), ('stderr', stderr)]:
                          if path.is_file():
                              data = path.read_bytes()
                              row[name] = {'path': str(path), 'bytes': len(data), 'sha256': sha(data)}
                  remaining()
                  return stdout.read_bytes()

              try:
                  need(native(['git', 'rev-parse', 'HEAD'], 'source-head').decode().strip() == head,
                       'Actual checkout differs from workflow source')
                  need(not native(['git', 'status', '--porcelain', '--untracked-files=no'], 'source-clean').strip(),
                       'Tracked source changed')
                  actual_simctl = native(['xcrun', '--find', 'simctl'], 'simctl-path').decode().strip()
                  need(Path(actual_simctl).is_absolute() and Path(actual_simctl).is_file(), 'Actual selected simctl is missing')
                  proof['actual_simctl_path'] = actual_simctl
                  xcode = native(['xcodebuild', '-version'], 'xcode-version').decode().strip()
                  need(re.fullmatch(r'Xcode 16\.4\s+Build version [A-Za-z0-9]+', xcode), 'Actual Xcode is not16.4')
                  proof['xcode_version_output'] = xcode
                  sdk = native(['xcrun', '--sdk', 'iphonesimulator', '--show-sdk-version'], 'sdk-version').decode().strip()
                  need(sdk == '18.5', 'Actual Xcode16.4 simulator SDK is not18.5')
                  proof['sdk_version'] = sdk
                  native(['xcrun', 'simctl', 'help', 'list'], 'simctl-list-help')
                  inventory = json.loads(native(['xcrun', 'simctl', 'list', 'devices', 'available', '-j'], 'devices-available'))
                  rows = device_rows(inventory)
                  available = [(runtime, device) for runtime, device in rows if device.get('isAvailable') is True]
                  need(available, 'No real available device exists; no UDID is invented')
                  runtime, selected = sorted(available, key=lambda pair: (pair[0], pair[1]['udid']))[0]
                  proof['available_device_count'] = len(rows)
                  proof['selected_native_device'] = {'runtime_identifier': runtime, 'device': selected}
                  matches = device_rows(json.loads(native(
                      ['xcrun', 'simctl', 'list', 'devices', selected['udid'], '-j'], 'devices-selected-udid')))
                  proof['udid_filter_result_count'] = len(matches)
                  need(matches == [(runtime, selected)], 'Actual UDID filter did not return exactly the original native row/runtime')
                  proof['actual_udid_filter_exact_one_match'] = True
                  booted = device_rows(json.loads(native(['xcrun', 'simctl', 'list', 'devices', 'booted', '-j'], 'devices-booted')))
                  proof['booted_result_count'] = len(booted)
                  proof['booted_result_states'] = [device.get('state') for _, device in booted]
                  need(all(device.get('state') == 'Booted' for _, device in booted), 'Booted query returned a non-Booted native row')
                  initial_booted_ids = sorted(device['udid'] for _, device in rows if device.get('state') == 'Booted')
                  need(sorted(device['udid'] for _, device in booted) == initial_booted_ids,
                       'Booted inventory changed or query does not match the fresh available snapshot')
                  proof['booted_query_observation'] = 'positive-rows' if booted else 'empty-result-only; positive Booted filtering was not exercised'
                  remaining()
                  proof['status'] = 'captured_cli_semantics'
                  code = 0
              except Exception as error:
                  proof['error'] = {'type': type(error).__name__, 'message': str(error)}
                  code = 1
              finally:
                  proof.update(finished_utc=utc(), elapsed_seconds=time.monotonic() - started)
                  write_new(OUT / 'proof.json', (json.dumps(proof, indent=2) + '\n').encode())
                  print(json.dumps({'status': proof['status'], 'ui_acceptance': False,
                                    'inventory_optimization_proven': False, 'error': proof.get('error')}))
              return code

          raise SystemExit(main())
          PY
      - name: Upload original CLI evidence
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name: ios18-simctl-list-proof
          path: TestResults/simctl-list-proof
          if-no-files-found: error
