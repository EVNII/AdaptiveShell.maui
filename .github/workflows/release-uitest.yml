name: iOS 18 Landing Native Screenshot Verification
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  DOTNET_NOLOGO: true
jobs:
  uitest-ios:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Select latest Xcode
        # 最新 maui-ios workload 需要较新的 iOS SDK,runner 默认 Xcode 可能偏旧。
        # 必须先 realpath 再选:macios 的已知缺陷是 Xcode 为符号链接时
        # actool 查找失败(exit 16384);切换后 runFirstLaunch 装组件
        run: |
          XCODE_APP="$(for app in /Applications/Xcode*.app; do realpath "$app"; done | sort -uV | tail -1)"
          echo "Selecting $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          sudo xcodebuild -license accept || true
          xcodebuild -runFirstLaunch
          xcodebuild -version

      - name: Install MAUI workloads
        run: dotnet workload install maui-ios --from-rollback-file workloads.rollback.json

      - name: Install Appium
        run: |
          npm i -g appium
          appium driver install xcuitest

      - name: Boot simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          for runtimes in data['devices'].values():
              for d in runtimes:
                  if d['name'] == 'iPhone 16':
                      print(d['udid']); sys.exit(0)
          ")
          [ -n "$UDID" ] || { echo 'iPhone 16 simulator not found'; exit 1; }
          xcrun simctl boot "$UDID" || true
          echo "UDID=$UDID" >> "$GITHUB_ENV"

      - name: Build example app
        # runner 最新 Xcode(26.3)的 SDK 低于 ios26.5 pack 要求(26.5),
        # SdkOnly 链接可绕过 MT0180(库用到的 UITab 等 API 在 26.3 SDK 内)
        run: dotnet build Example/ExampleAShellApp/ExampleAShellApp.csproj -c Debug -p:TargetFrameworks=net10.0-ios26.5 -p:RuntimeIdentifier=iossimulator-arm64 -p:MtouchLink=SdkOnly

      - name: Select verified Xcode for WebDriverAgent
        # The AUT retains the original newer-SDK build above. The iOS 18 WDA
        # toolchain matches the successful release iOS 18 consumer (Xcode 16.4).
        # Do not copy a missing runtime library into the failing Xcode 26.3.
        timeout-minutes: 2
        run: |
          set -euo pipefail
          mkdir -p TestResults
          WDA_XCODE_APP="$(realpath /Applications/Xcode_16.4.app)"
          WDA_DEVELOPER_PATH="$WDA_XCODE_APP/Contents/Developer"
          WDA_TESTING_INTEROP="$WDA_DEVELOPER_PATH/Platforms/iPhoneSimulator.platform/Developer/usr/lib/lib_TestingInterop.dylib"
          printf 'AUT build SDK: ' > TestResults/pr-wda-toolchain.txt
          /usr/libexec/PlistBuddy -c 'Print DTSDKName' Example/ExampleAShellApp/bin/Debug/net10.0-ios26.5/iossimulator-arm64/ExampleAShellApp.app/Info.plist >> TestResults/pr-wda-toolchain.txt
          printf 'WDA developer path: %s\nOptional Swift Testing interop path: %s\n' "$WDA_DEVELOPER_PATH" "$WDA_TESTING_INTEROP" >> TestResults/pr-wda-toolchain.txt
          # WDA 16.12.11 explicitly excludes this dependency for Xcode 16.
          if [ -f "$WDA_TESTING_INTEROP" ] && [ -r "$WDA_TESTING_INTEROP" ]; then
            echo 'Optional Swift Testing interop: present' >> TestResults/pr-wda-toolchain.txt
            shasum -a 256 "$WDA_TESTING_INTEROP" >> TestResults/pr-wda-toolchain.txt
          else
            echo 'Optional Swift Testing interop: absent or unreadable (not required by Xcode 16)' >> TestResults/pr-wda-toolchain.txt
          fi
          sudo xcode-select -s "$WDA_DEVELOPER_PATH"
          [ "$(xcode-select -p)" = "$WDA_DEVELOPER_PATH" ]
          WDA_XCODE_VERSION="$(xcodebuild -version)"
          printf '%s\n' "$WDA_XCODE_VERSION" >> TestResults/pr-wda-toolchain.txt
          [ "$(printf '%s\n' "$WDA_XCODE_VERSION" | head -n 1)" = 'Xcode 16.4' ]
          WDA_SIMULATOR_SDK_VERSION="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          WDA_SIMULATOR_SDK_PATH="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          WDA_XCTEST_FRAMEWORK="$WDA_DEVELOPER_PATH/Platforms/iPhoneSimulator.platform/Developer/Library/Frameworks/XCTest.framework"
          printf 'WDA simulator SDK: %s\nWDA simulator SDK path: %s\nWDA XCTest framework: %s\n' "$WDA_SIMULATOR_SDK_VERSION" "$WDA_SIMULATOR_SDK_PATH" "$WDA_XCTEST_FRAMEWORK" >> TestResults/pr-wda-toolchain.txt
          if [[ ! "$WDA_SIMULATOR_SDK_VERSION" =~ ^[0-9]+([.][0-9]+)+$ ]] || [ ! -d "$WDA_SIMULATOR_SDK_PATH" ] || [[ "$WDA_SIMULATOR_SDK_PATH" != "$WDA_DEVELOPER_PATH/Platforms/iPhoneSimulator.platform/Developer/SDKs/"* ]] || [ ! -d "$WDA_XCTEST_FRAMEWORK" ] || [ ! -r "$WDA_XCTEST_FRAMEWORK/XCTest" ]; then
            echo 'The selected toolchain must expose its genuine simulator SDK and XCTest framework; native UI suite remains pending.' >> TestResults/pr-wda-toolchain.txt
            cat TestResults/pr-wda-toolchain.txt
            exit 1
          fi
          shasum -a 256 "$WDA_XCTEST_FRAMEWORK/XCTest" >> TestResults/pr-wda-toolchain.txt
          echo "DEVELOPER_DIR=$WDA_DEVELOPER_PATH" >> "$GITHUB_ENV"
          xcrun simctl list devices available -j | python3 -c '
          import json, os, sys
          data = json.load(sys.stdin)
          exact = [(runtime, device) for runtime, devices in data["devices"].items() for device in devices if device.get("udid") == os.environ["UDID"]]
          if len(exact) != 1 or exact[0][1].get("name") != "iPhone 16" or exact[0][1].get("isAvailable") is not True:
              raise SystemExit("The original iPhone 16 UDID must remain uniquely available under the verified WDA toolchain")
          print(json.dumps({"runtime": exact[0][0], "device": exact[0][1]}, separators=(",", ":")))
          ' >> TestResults/pr-wda-toolchain.txt
          echo 'WDA toolchain preflight verified; native UI suite remains pending.' >> TestResults/pr-wda-toolchain.txt
          cat TestResults/pr-wda-toolchain.txt

      - name: Run UI tests
        run: |
          npx appium --keep-alive-timeout 900 --default-capabilities '{"appium:showXcodeLog":true}' > appium.log 2>&1 &
          export UITEST_PLATFORM=ios UITEST_FORM=compact
          export UITEST_DEVICE_NAME="iPhone 16" UITEST_DEVICE_UDID="$UDID"
          export UITEST_APP_PATH="$GITHUB_WORKSPACE/Example/ExampleAShellApp/bin/Debug/net10.0-ios26.5/iossimulator-arm64/ExampleAShellApp.app"
          dotnet test Tests/AdaptiveShell.UITests/AdaptiveShell.UITests.csproj --logger "trx;LogFileName=e2e.trx" --results-directory TestResults

      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uitest-ios
          path: |
            TestResults
            appium.log
          if-no-files-found: ignore
