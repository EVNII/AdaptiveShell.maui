name: Duo Official Shell Control

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true

jobs:
  build-ios-27-1-duo:
    permissions:
      contents: read
    runs-on: xcode-27
    timeout-minutes: 60
    name: Produce exact SDK27.1 app and complete 13-test bundle
    outputs:
      dotnet_sdk: ${{ steps.pack.outputs.dotnet_sdk }}
      manifest_sha256: ${{ steps.pack.outputs.manifest_sha256 }}
      archive_sha256: ${{ steps.pack.outputs.archive_sha256 }}
      artifact_id: ${{ steps.bundle.outputs.artifact-id }}
      artifact_digest: ${{ steps.bundle.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Select Xcode 27.1 beta without installing or booting a simulator
        timeout-minutes: 10
        run: |
          test -d /Applications/Xcode_27.1_beta.app
          sudo xcode-select -s /Applications/Xcode_27.1_beta.app/Contents/Developer
          sudo xcodebuild -license accept
          xcodebuild -runFirstLaunch
          xcodebuild -version
          xcodebuild -showsdks
          test "$(xcrun --sdk iphonesimulator --show-sdk-version)" = "27.1"
          mkdir -p TestResults
      - name: Install the same MAUI workload on the producer only
        timeout-minutes: 15
        run: dotnet workload install maui-ios --from-rollback-file workloads.rollback.json
      - name: Prepare opt-in diagnostic partial manifest before normal build signing
        run: |
          python3 -c 'import os,re,pathlib,plistlib; assert os.environ["GITHUB_ACTIONS"]=="true" and os.environ["GITHUB_JOB"]=="build-ios-27-1-duo" and re.fullmatch("[0-9a-f]{40}",os.environ["GITHUB_SHA"]); p=pathlib.Path("TestResults/duo-visibility-diagnostic.plist"); assert not p.exists(); p.write_bytes(plistlib.dumps({"AShellDuoVisibilityDiagnostic":True,"AShellDuoVisibilityDiagnosticSource":os.environ["GITHUB_SHA"],"AShellDuoOfficialShellControl":True,"AShellDuoOfficialShellControlSource":os.environ["GITHUB_SHA"]}))'
      - name: Build the same Duo app using SDK27.1
        timeout-minutes: 20
        run: |
          set -euo pipefail
          dotnet build Example/ExampleAShellApp/ExampleAShellApp.csproj --disable-build-servers -c Debug -p:TargetFrameworks=net10.0-ios26.5 -p:RuntimeIdentifier=iossimulator-arm64 -p:MtouchLink=SdkOnly -p:MtouchSdkVersion=27.1 -p:AShellDuoVisibilityDiagnosticManifest="$GITHUB_WORKSPACE/TestResults/duo-visibility-diagnostic.plist" 2>&1 | tee TestResults/duo-producer-build.log
          APP="Example/ExampleAShellApp/bin/Debug/net10.0-ios26.5/iossimulator-arm64/ExampleAShellApp.app"
          SDK=$(/usr/libexec/PlistBuddy -c 'Print :DTSDKName' "$APP/Info.plist")
          test "$SDK" = "iphonesimulator27.1"
          python3 -c 'import os,plistlib,pathlib; x=plistlib.loads(pathlib.Path("Example/ExampleAShellApp/bin/Debug/net10.0-ios26.5/iossimulator-arm64/ExampleAShellApp.app/Info.plist").read_bytes()); assert x.get("AShellDuoVisibilityDiagnostic") is True and x.get("AShellDuoVisibilityDiagnosticSource")==os.environ["GITHUB_SHA"] and x.get("AShellDuoOfficialShellControl") is True and x.get("AShellDuoOfficialShellControlSource")==os.environ["GITHUB_SHA"]'
          codesign --verify --strict "$APP"
          plutil -p "$APP/Info.plist" > TestResults/duo-build-info.txt
          xcrun vtool -show-build "$APP/ExampleAShellApp" > TestResults/duo-native-build.txt
          python3 -c 'import re,pathlib; assert re.search(r"sdk\s+27\.1(?:\s|$)", pathlib.Path("TestResults/duo-native-build.txt").read_text()), "Native binary was not built with SDK 27.1"'
      - name: Build the current complete 13-test UI test assembly on the producer only
        timeout-minutes: 10
        run: |
          set -euo pipefail
          dotnet build Tests/AdaptiveShell.UITests/AdaptiveShell.UITests.csproj --disable-build-servers 2>&1 | tee TestResults/duo-producer-test-build.log
      - name: Shut down producer build servers
        timeout-minutes: 2
        run: |
          python3 .github/workflows/scripts/duo-ci-server.py shutdown-build-servers
          cp TestResults/duo-build-server-shutdown.txt TestResults/duo-producer-build-server-shutdown.txt
      - name: Pack exact app/test outputs and public test package closure
        id: pack
        timeout-minutes: 10
        run: python3 .github/workflows/scripts/duo-split-build-transfer.py pack --output "$RUNNER_TEMP/duo-build-bundle"
      - name: Upload immutable build handoff
        id: bundle
        timeout-minutes: 10
        uses: actions/upload-artifact@v4
        with:
          name: duo-split-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/duo-build-bundle
          compression-level: 0
          if-no-files-found: error
      - name: Upload producer evidence even on failure
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: duo-split-producer-evidence
          path: TestResults/duo-*
          if-no-files-found: warn

  uitest-ios-27-1-duo:
    needs: build-ios-27-1-duo
    permissions:
      contents: read
      actions: read
    runs-on: xcode-27
    timeout-minutes: 90
    name: uitest-ios (27.1, iPhone Duo) [beta]
    env:
      DUO_REMOVE_UNUSED_27_0_RUNTIME: 'true'
      DUO_DIAGNOSTIC_DISABLE_SPOTLIGHT_INDEXING: 'true'
      DUO_DIAGNOSTIC_DEFER_APPIUM_UNTIL_INSTALLED: 'true'
      DUO_DIAGNOSTIC_OFFICIAL_SHELL_CONTROL: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ needs.build-ios-27-1-duo.outputs.dotnet_sdk }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select Xcode 27.1 beta
        timeout-minutes: 10
        run: |
          test -d /Applications/Xcode_27.1_beta.app
          sudo xcode-select -s /Applications/Xcode_27.1_beta.app/Contents/Developer
          sudo xcodebuild -license accept
          xcodebuild -runFirstLaunch
          xcodebuild -version
          xcodebuild -showsdks
          test "$(xcrun --sdk iphonesimulator --show-sdk-version)" = "27.1"
          mkdir -p TestResults
      - name: Download the exact same-run producer artifact by immutable ID
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build-ios-27-1-duo.outputs.artifact_id }}
          # v4 ID downloads use the multiple-artifact path even for one ID.
          merge-multiple: true
          path: ${{ runner.temp }}/duo-build-input
      - name: Verify and restore exact app/test outputs without build or restore
        timeout-minutes: 10
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DUO_BUNDLE_ID: ${{ needs.build-ios-27-1-duo.outputs.artifact_id }}
          DUO_BUNDLE_DIGEST: ${{ needs.build-ios-27-1-duo.outputs.artifact_digest }}
          DUO_MANIFEST_SHA: ${{ needs.build-ios-27-1-duo.outputs.manifest_sha256 }}
          DUO_ARCHIVE_SHA: ${{ needs.build-ios-27-1-duo.outputs.archive_sha256 }}
          DUO_BUNDLE_NAME: duo-split-build-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python3 .github/workflows/scripts/duo-split-build-transfer.py consume --input "$RUNNER_TEMP/duo-build-input" --artifact-id "$DUO_BUNDLE_ID" --artifact-name "$DUO_BUNDLE_NAME" --artifact-digest "$DUO_BUNDLE_DIGEST" --manifest-sha256 "$DUO_MANIFEST_SHA" --archive-sha256 "$DUO_ARCHIVE_SHA"
      - name: Disable only Spotlight indexing on both owned ephemeral VM volumes
        timeout-minutes: 2
        run: python3 .github/workflows/scripts/duo-split-build-run.py --disable-spotlight-indexing
      - name: Remove only unused iOS 27.0 runtime images in this Duo VM
        timeout-minutes: 6
        run: python3 .github/workflows/scripts/duo-prune-runtime.py
      - name: Install exact Duo simulator runtime
        timeout-minutes: 15
        run: xcodebuild -downloadPlatform iOS -buildVersion 24A94401 -architectureVariant arm64
      - name: Prepare and verify iPhone Duo
        timeout-minutes: 5
        run: python3 .github/workflows/scripts/prepare-duo.py --output TestResults/duo-environment.json
      - name: Install Appium
        timeout-minutes: 15
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, signal, subprocess, sys, time
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import urlparse

          out = Path('TestResults')
          out.mkdir(exist_ok=True)
          proof = {'schema': 1, 'status': 'error', 'scope': 'owned hosted Duo official npm toolchain only', 'ui_acceptance': False, 'commands': []}
          started = time.monotonic()
          def need(ok, message):
              if not ok: raise ValueError(message)
          def sha(path): return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          def run(args, label, seconds=30):
              remaining = min(seconds, 750 - (time.monotonic() - started))
              need(remaining > 0, 'Tool installation shared budget expired')
              row = {'argv': args, 'label': label, 'timeout_seconds': remaining, 'status': 'started', 'started_utc': datetime.now(timezone.utc).isoformat()}
              proof['commands'].append(row)
              process = None
              try:
                  process = subprocess.Popen(args, stdout=subprocess.PIPE, stderr=subprocess.PIPE, start_new_session=True)
                  row['pid'] = process.pid
                  try: group = os.getpgid(process.pid)
                  except ProcessLookupError: group = None
                  need(group == process.pid or (group is None and process.poll() is not None), 'Tool child is not an owned process group')
                  stdout, stderr = process.communicate(timeout=remaining)
                  row['exit_code'] = process.returncode
                  (out / ('duo-toolchain-' + label + '.stdout')).write_bytes(stdout)
                  (out / ('duo-toolchain-' + label + '.stderr')).write_bytes(stderr)
                  row.update(stdout_sha256=hashlib.sha256(stdout).hexdigest(), stderr_sha256=hashlib.sha256(stderr).hexdigest())
                  need(process.returncode == 0, 'Official npm/tool read failed: ' + label)
                  row['status'] = 'completed'
                  return stdout.decode('utf-8').strip()
              except Exception as error:
                  row.update(status='error', error=repr(error))
                  if process is not None:
                      try:
                          if process.poll() is None and os.getpgid(process.pid) == process.pid:
                              os.killpg(process.pid, signal.SIGKILL)
                              row['owned_group_kill_requested'] = True
                          stdout, stderr = process.communicate(timeout=2)
                          (out / ('duo-toolchain-' + label + '.stdout')).write_bytes(stdout)
                          (out / ('duo-toolchain-' + label + '.stderr')).write_bytes(stderr)
                          row.update(stdout_sha256=hashlib.sha256(stdout).hexdigest(), stderr_sha256=hashlib.sha256(stderr).hexdigest())
                      except Exception as cleanup: row['cleanup_error'] = repr(cleanup)
                  raise
              finally:
                  row['finished_utc'] = datetime.now(timezone.utc).isoformat()
          try:
              need(sys.platform == 'darwin' and all(os.environ.get(k) == v for k, v in {
                  'GITHUB_ACTIONS': 'true', 'RUNNER_OS': 'macOS', 'RUNNER_ENVIRONMENT': 'github-hosted',
                  'GITHUB_REPOSITORY': 'EVNII/AdaptiveShell.maui', 'GITHUB_JOB': 'uitest-ios-27-1-duo',
                  'GITHUB_REF_NAME': 'codex/duo-official-shell-control', 'GITHUB_WORKFLOW': 'Duo Official Shell Control'
              }.items()), 'Exact hosted Duo CI scope rejected')
              head = os.environ.get('GITHUB_SHA', '')
              need(re.fullmatch('[0-9a-f]{40}', head) and os.environ.get('GITHUB_WORKFLOW_SHA') == head, 'Workflow/source identity differs')
              workspace = Path(os.environ['GITHUB_WORKSPACE']).resolve()
              need(Path.cwd().resolve() == workspace and run(['git', 'rev-parse', 'HEAD'], 'head') == head, 'Checkout/source differs')
              need(os.environ['GITHUB_WORKFLOW_REF'].split('@')[0] == 'EVNII/AdaptiveShell.maui/.github/workflows/release-uitest.yml', 'Wrong workflow path')
              temporary = Path(os.environ['RUNNER_TEMP']).resolve()
              home = temporary / 'duo-official-appium-home'
              need(temporary.is_dir() and not home.exists() and not home.is_symlink(), 'Owned Appium home already exists')
              home.mkdir()
              os.environ['APPIUM_HOME'] = str(home)
              os.environ['npm_config_registry'] = 'https://registry.npmjs.org/'
              with open(os.environ['GITHUB_ENV'], 'a') as stream: stream.write('APPIUM_HOME=' + str(home) + '\n')
              proof.update(repository=os.environ['GITHUB_REPOSITORY'], head_sha=head,
                  workflow_sha256=sha(workspace / '.github/workflows/release-uitest.yml'),
                  run_id=os.environ['GITHUB_RUN_ID'], run_attempt=os.environ['GITHUB_RUN_ATTEMPT'], appium_home=str(home))
              expected = {'appium': '3.8.0', 'appium-xcuitest-driver': '12.13.3', 'appium-webdriveragent': '16.12.11'}
              dists = {}
              for package, version in expected.items():
                  dist = json.loads(run(['npm', 'view', package + '@' + version, 'dist', '--json', '--registry=https://registry.npmjs.org/'], 'dist-' + package))
                  need(urlparse(dist['tarball']).scheme == 'https' and urlparse(dist['tarball']).netloc == 'registry.npmjs.org'
                       and isinstance(dist.get('integrity'), str) and dist['integrity'].startswith('sha512-'), 'Non-official npm distribution')
                  dists[package] = dist
              proof['official_npm_distributions'] = dists
              run(['npm', 'install', '-g', 'appium@3.8.0', '--registry=https://registry.npmjs.org/', '--no-audit', '--no-fund'], 'install-appium', 180)
              run(['appium', 'driver', 'install', 'xcuitest@12.13.3'], 'install-xcuitest', 180)
              manifest = home / 'package.json'
              need(manifest.is_file() and not manifest.is_symlink(), 'Appium-owned npm root manifest is missing')
              before = json.loads(manifest.read_text())
              proof['appium_home_manifest_before'] = before
              resolver = "const fs=require('fs'),p=require('path');const a=process.env.APPIUM_HOME;const d=require.resolve('appium-xcuitest-driver/package.json',{paths:[a]});const w=require.resolve('appium-webdriveragent/package.json',{paths:[p.dirname(d)]});console.log(JSON.stringify({driver:{path:fs.realpathSync(d),package:JSON.parse(fs.readFileSync(d))},wda:{path:fs.realpathSync(w),package:JSON.parse(fs.readFileSync(w))}}));"
              resolved = json.loads(run(['node', '-e', resolver], 'resolved-before'))
              for item, package in [('driver', 'appium-xcuitest-driver'), ('wda', 'appium-webdriveragent')]:
                  need(Path(resolved[item]['path']).is_relative_to(home) and resolved[item]['package']['name'] == package, 'Resolution escaped owned Appium home')
              need(resolved['driver']['package']['version'] == '12.13.3', 'Exact driver installation mismatch')
              proof['override_applied'] = resolved['wda']['package']['version'] != '16.12.11'
              if proof['override_applied']:
                  run(['npm', 'pkg', 'set', 'overrides.appium-webdriveragent=16.12.11', '--prefix', str(home)], 'pin-wda-override')
                  after = json.loads(manifest.read_text()); wanted = dict(before); overrides = dict(before.get('overrides', {})); overrides['appium-webdriveragent'] = '16.12.11'; wanted['overrides'] = overrides
                  need(after == wanted, 'Override changed unrelated root manifest fields')
                  run(['npm', 'install', '--prefix', str(home), '--ignore-scripts', '--package-lock=true', '--no-audit', '--no-fund', '--registry=https://registry.npmjs.org/'], 'reify-owned-wda', 180)
              resolved = json.loads(run(['node', '-e', resolver], 'resolved-after'))
              proof['installed_resolution'] = resolved
              for item, package in [('driver', 'appium-xcuitest-driver'), ('wda', 'appium-webdriveragent')]:
                  path = Path(resolved[item]['path']); data = resolved[item]['package']
                  need(path.is_relative_to(home) and data['name'] == package and data['version'] == expected[package], 'Installed official package/version differs')
                  resolved[item]['package_json_sha256'] = sha(path)
              proof['appium_home_manifest_after'] = json.loads(manifest.read_text())
              lock_path = home / 'package-lock.json'
              # Appium's official CLI uses --no-package-lock on a fresh standalone home.
              # Reification after an override explicitly enables the npm lock.
              if proof['override_applied']:
                  lock = json.loads(lock_path.read_text())
                  for item, package in [('driver', 'appium-xcuitest-driver'), ('wda', 'appium-webdriveragent')]:
                      key = str(Path(resolved[item]['path']).parent.relative_to(home))
                      entry = lock['packages'][key]
                      need(entry['version'] == expected[package] and entry.get('resolved') == dists[package]['tarball']
                           and entry.get('integrity') == dists[package]['integrity'], 'Installed package lock is not exact official npm distribution')
                  proof['package_lock_sha256'] = sha(lock_path)
              else:
                  proof['package_lock_sha256'] = sha(lock_path) if lock_path.is_file() else None
                  proof['no_reification_reason'] = 'Official CLI already installed the exact resolved WDA version'
              need(run(['appium', '--version'], 'appium-version') == '3.8.0', 'Appium CLI version differs')
              global_info = json.loads(run(['npm', 'list', '-g', 'appium', '--depth=0', '--json'], 'global-appium'))
              need(global_info['dependencies']['appium']['version'] == '3.8.0', 'Global Appium package differs')
              global_root = run(['npm', 'root', '-g'], 'global-root')
              appium_resolver = "const fs=require('fs'),p=require('path');const q=require.resolve('appium/package.json',{paths:[process.argv[1]]});console.log(JSON.stringify({path:fs.realpathSync(q),package:JSON.parse(fs.readFileSync(q))}));"
              installed_appium = json.loads(run(['node', '-e', appium_resolver, str(Path(global_root).parent)], 'resolved-appium'))
              appium_path = Path(installed_appium['path'])
              need(appium_path.is_relative_to(Path(global_root).resolve()) and installed_appium['package']['name'] == 'appium'
                   and installed_appium['package']['version'] == '3.8.0', 'Global Appium resolution differs')
              installed_appium['package_json_sha256'] = sha(appium_path)
              proof['installed_appium'] = installed_appium
              drivers = run(['appium', 'driver', 'list', '--installed', '--json'], 'drivers')
              receipt = json.loads(drivers)['xcuitest']
              need(receipt['pkgName'] == 'appium-xcuitest-driver' and receipt['version'] == '12.13.3'
                   and receipt['installType'] == 'npm' and Path(receipt['installPath']).resolve() == Path(resolved['driver']['path']).parent,
                   'Appium driver receipt is not the exact owned official npm installation')
              (out / 'duo-appium-version.txt').write_text('3.8.0\n')
              (out / 'duo-drivers.json').write_text(drivers + '\n')
              (out / 'duo-wda-version.json').write_text(json.dumps(resolved['wda']['package'], indent=2) + '\n')
              xcode = run(['xcodebuild', '-version'], 'xcode-version')
              need(re.search(r'^Xcode 27\.1(?:\s|$)', xcode) and run(['xcrun', '--sdk', 'iphonesimulator', '--show-sdk-version'], 'sdk-version') == '27.1', 'Actual native toolchain differs')
              proof.update(status='verified', xcode_version=xcode, native_sdk='27.1')
          except Exception as error:
              proof['error'] = repr(error)
          finally:
              proof['elapsed_seconds'] = time.monotonic() - started
              (out / 'duo-official-toolchain.json').write_text(json.dumps(proof, indent=2) + '\n')
          if proof['status'] != 'verified': raise SystemExit(1)
          PY
      # Requires the Duo opt-in C# hook: usePrebuiltWDA and the exact exported path.
      - name: Build installed WDA16.12.11 for exact Shutdown Duo before boot
        timeout-minutes: 15
        run: python3 .github/workflows/scripts/duo-wda-prebuild.py build
      - name: Verify owned Appium remains unstarted before native boot and install
        timeout-minutes: 4
        run: python3 .github/workflows/scripts/duo-split-build-run.py --verify-appium-deferred-preboot
      - name: Capture bounded preboot resource observations
        timeout-minutes: 2
        run: python3 .github/workflows/scripts/duo-split-build-run.py --resource-observation before-boot
      - name: Upload preboot source and native environment evidence
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: duo-split-preboot-environment
          path: |
            TestResults/duo-*
            appium.log
          if-no-files-found: warn
      - name: Run one complete13 TestHost with native boot and preinstall proof
        id: duo_original_tests
        timeout-minutes: 25
        env:
          UITEST_PLATFORM: ios
          UITEST_FORM: duo
          UITEST_DEVICE_NAME: ${{ env.DUO_DEVICE_NAME }}
          UITEST_DEVICE_UDID: ${{ env.DUO_DEVICE_UDID }}
          UITEST_APP_PATH: ${{ github.workspace }}/Example/ExampleAShellApp/bin/Debug/net10.0-ios26.5/iossimulator-arm64/ExampleAShellApp.app
          DUO_DIAGNOSTIC_PREBOOT_HOST: 'true'
          DUO_DIAGNOSTIC_PREINSTALL_AUT: 'true'
          UITEST_DUO_COMPATIBILITY_OPTIONS: 'true'
          UITEST_DUO_VISIBILITY_DIAGNOSTIC: 'true'
        run: python3 .github/workflows/scripts/duo-split-build-run.py
      - name: Verify Duo actual prebuilt WDA session options
        run: python3 .github/workflows/scripts/duo-wda-prebuild.py verify-session
      - name: Verify Duo device and screenshot evidence
        run: python3 .github/workflows/scripts/verify-duo-evidence.py TestResults --strict > TestResults/duo-checks.json
      - name: Upload Duo evidence
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: shots-ios27.1-duo-iPhoneDuo
          path: |
            TestResults/shots
            TestResults/screenshots
            TestResults/*.trx
            TestResults/landing-*.xml
            TestResults/landing-*.json
            TestResults/duo-*
            appium.log
          if-no-files-found: error
      - name: Collect opted-in native visibility log after original tests
        if: always()
        timeout-minutes: 2
        env:
          UITEST_PLATFORM: ios
          UITEST_FORM: duo
          UITEST_DEVICE_UDID: ${{ env.DUO_DEVICE_UDID }}
          UITEST_DUO_VISIBILITY_DIAGNOSTIC: 'true'
          DUO_ORIGINAL_TEST_OUTCOME: ${{ steps.duo_original_tests.outcome }}
        run: python3 .github/workflows/scripts/duo-collect-visibility-log.py
      - name: Capture bounded failure health
        if: failure()
        timeout-minutes: 2
        run: python3 .github/workflows/scripts/duo-split-build-run.py --health workflow-failure
      - name: Upload post-suite side diagnostics
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: duo-post-suite-side-diagnostics
          path: |
            TestResults/duo-visibility-post
            TestResults/duo-health-workflow-failure*
            TestResults/duo-startup-events.jsonl
          if-no-files-found: warn
