name: Duo startup diagnostic

# Read-only startup investigation on a separate public diagnostic branch.
# This single filtered test does not satisfy the release/full-theme gate.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true

jobs:
  duo-startup-diagnostic:
    runs-on: xcode-27
    timeout-minutes: 90
    name: Duo startup diagnostic (27.1, same startup path)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select Xcode 27.1 beta
        timeout-minutes: 10
        run: |
          test -d /Applications/Xcode_27.1_beta.app
          sudo xcode-select -s /Applications/Xcode_27.1_beta.app/Contents/Developer
          sudo xcodebuild -license accept
          xcodebuild -runFirstLaunch
          xcodebuild -version
          xcodebuild -showsdks
          test "$(xcrun --sdk iphonesimulator --show-sdk-version)" = "27.1"
      - name: Install exact Duo simulator runtime
        timeout-minutes: 30
        run: xcodebuild -downloadPlatform iOS -buildVersion 24A94401 -architectureVariant arm64
      - name: Prepare and verify iPhone Duo
        timeout-minutes: 5
        run: python3 .github/workflows/scripts/prepare-duo.py --output TestResults/duo-environment.json
      - name: Install MAUI workloads
        timeout-minutes: 15
        run: dotnet workload install maui-ios --from-rollback-file workloads.rollback.json
      - name: Build Duo app with iOS 27.1 SDK
        timeout-minutes: 20
        run: |
          dotnet build Example/ExampleAShellApp/ExampleAShellApp.csproj -c Debug -p:TargetFrameworks=net10.0-ios26.5 -p:RuntimeIdentifier=iossimulator-arm64 -p:MtouchLink=SdkOnly -p:MtouchSdkVersion=27.1
          APP="Example/ExampleAShellApp/bin/Debug/net10.0-ios26.5/iossimulator-arm64/ExampleAShellApp.app"
          SDK=$(/usr/libexec/PlistBuddy -c 'Print :DTSDKName' "$APP/Info.plist")
          test "$SDK" = "iphonesimulator27.1"
          plutil -p "$APP/Info.plist" > TestResults/duo-build-info.txt
          xcrun vtool -show-build "$APP/ExampleAShellApp" > TestResults/duo-native-build.txt
          python3 -c 'import re,pathlib; assert re.search(r"sdk\s+27\.1(?:\s|$)", pathlib.Path("TestResults/duo-native-build.txt").read_text()), "Native binary was not built with SDK 27.1"'
      - name: Install Appium
        timeout-minutes: 10
        run: |
          npm i -g appium
          appium driver install xcuitest
          appium --version > TestResults/duo-appium-version.txt
          appium driver list --installed --json > TestResults/duo-drivers.json
          node -e 'const p=require("path"),f=require("fs"),o=require("os"); const a=process.env.APPIUM_HOME||p.join(o.homedir(),".appium"); const q=require.resolve("appium-webdriveragent/package.json",{paths:[p.join(a,"node_modules/appium-xcuitest-driver")]}); process.stdout.write(f.readFileSync(q,"utf8"));' > TestResults/duo-wda-version.json
      - name: Boot iPhone Duo
        timeout-minutes: 10
        run: |
          xcrun simctl boot "$DUO_DEVICE_UDID"
          xcrun simctl bootstatus "$DUO_DEVICE_UDID" -b
          xcrun simctl getenv "$DUO_DEVICE_UDID" SIMULATOR_MODEL_IDENTIFIER > TestResults/duo-model.txt
          test "$(cat TestResults/duo-model.txt)" = "iPhone19,4"
          xcrun simctl io "$DUO_DEVICE_UDID" enumerate > TestResults/duo-displays.txt
      - name: Build UI test assembly (outside startup deadline)
        timeout-minutes: 10
        run: dotnet build Tests/AdaptiveShell.UITests/AdaptiveShell.UITests.csproj
      - name: Start Appium
        run: npx appium > appium.log 2>&1 &
      - name: Run bounded Duo startup diagnostic
        timeout-minutes: 9
        env:
          UITEST_PLATFORM: ios
          UITEST_FORM: duo
          UITEST_DEVICE_NAME: ${{ env.DUO_DEVICE_NAME }}
          UITEST_DEVICE_UDID: ${{ env.DUO_DEVICE_UDID }}
          UITEST_APP_PATH: ${{ github.workspace }}/Example/ExampleAShellApp/bin/Debug/net10.0-ios26.5/iossimulator-arm64/ExampleAShellApp.app
        run: |
          python3 - <<'PY'
          #!/usr/bin/env python3
          """Duo startup diagnostic only; never a release/theme quality gate.

          The test source and Appium startup/retry timeouts remain unchanged. An external
          watchdog bounds Appium readiness to 60s and the filtered test process to 300s.
          Test/capture commands own process groups; the watchdog kills their descendants.
          """
          from datetime import datetime, timezone
          import json
          import os
          from pathlib import Path
          import signal
          import subprocess
          import sys
          import time

          RESULTS = Path("TestResults")
          LOG_OFFSETS = {}


          def event(stage, **details):
              RESULTS.mkdir(parents=True, exist_ok=True)
              row = {"utc": datetime.now(timezone.utc).isoformat(), "stage": stage, **details}
              value = json.dumps(row, ensure_ascii=False)
              print(value, flush=True)
              with (RESULTS / "duo-startup-events.jsonl").open("a", encoding="utf-8") as stream:
                  stream.write(value + "\n")


          def flush_logs():
              for path in (Path("appium.log"), RESULTS / "duo-test-console.log"):
                  if not path.exists():
                      continue
                  with path.open("rb") as stream:
                      stream.seek(LOG_OFFSETS.get(str(path), 0))
                      chunk = stream.read()
                      LOG_OFFSETS[str(path)] = stream.tell()
                  if chunk:
                      # Keep complete logs in the artifact; bound each live excerpt.
                      shown = chunk[-24000:].decode("utf-8", errors="replace")
                      print(f"--- {path} new output ({len(chunk)} bytes) ---\n{shown}", flush=True)


          def start_owned(command, **kwargs):
              process = subprocess.Popen(command, start_new_session=True, **kwargs)
              # Only process groups explicitly created by this helper are signal targets.
              process._duo_owned_pgid = process.pid
              return process


          def signal_owned_group(process, sig):
              pgid = getattr(process, "_duo_owned_pgid", None)
              if pgid != process.pid or not isinstance(pgid, int) or pgid <= 1 or pgid == os.getpgrp():
                  event("process-group-signal-refused", pid=process.pid, pgid=pgid)
                  return "refused"
              try:
                  os.killpg(pgid, sig)
                  return "sent"
              except ProcessLookupError:
                  return "absent"
              except PermissionError as error:
                  event("process-group-permission-error", pgid=pgid, signal=int(sig), error=str(error))
                  # Xcode can leave root-owned descendants in this explicitly created
                  # group. CI-only, noninteractive sudo is bounded and never targets a
                  # broad process name or another job's group.
                  if os.environ.get("GITHUB_ACTIONS") == "true":
                      name = signal.Signals(sig).name.removeprefix("SIG")
                      try:
                          completed = subprocess.run([
                              "sudo", "-n", "/bin/kill", "-s", name, "--", f"-{pgid}",
                          ], capture_output=True, text=True, timeout=3)
                          event("process-group-sudo-signal", pgid=pgid, signal=name,
                                exit_code=completed.returncode, stderr=completed.stderr[-2000:])
                          return "sent" if completed.returncode == 0 else "failed"
                      except (OSError, subprocess.TimeoutExpired) as sudo_error:
                          event("process-group-sudo-error", pgid=pgid, signal=name, error=str(sudo_error))
                  return "failed"
              except OSError as error:
                  event("process-group-signal-error", pgid=pgid, signal=int(sig), error=str(error))
                  return "failed"


          def stop_group(process, label, grace=5):
              # Cleanup is diagnostic evidence: it must never prevent native capture or
              # the final summary, even if the runner denies process-group operations.
              if process is None:
                  return
              event("stop-process-group", process=label, pgid=process.pid)
              try:
                  status = signal_owned_group(process, signal.SIGTERM)
                  if status in ("absent", "refused"):
                      process.poll()
                      return
                  deadline = time.monotonic() + grace
                  while time.monotonic() < deadline:
                      try:
                          os.killpg(process.pid, 0)
                      except ProcessLookupError:
                          process.poll()
                          return
                      except PermissionError:
                          # The group can still exist with descendants of another uid;
                          # continue to the bounded, owned-group KILL fallback.
                          break
                      time.sleep(min(0.1, max(0, deadline - time.monotonic())))
                  signal_owned_group(process, signal.SIGKILL)
                  try:
                      process.wait(timeout=2)
                  except subprocess.TimeoutExpired:
                      event("process-reap-timeout", process=label, pid=process.pid)
              except Exception as error:
                  event("process-group-cleanup-error", process=label, pid=process.pid,
                        type=type(error).__name__, error=str(error))


          def probe_json(url, output, timeout=2):
              try:
                  # curl --max-time is a whole-transfer deadline, including a slow body.
                  # This command has no background descendants; subprocess also bounds it.
                  response = subprocess.run([
                      "curl", "--fail", "--silent", "--show-error", "--max-time",
                      str(timeout), url,
                  ], capture_output=True, timeout=timeout)
                  if response.returncode:
                      raise ValueError(response.stderr.decode("utf-8", errors="replace"))
                  if len(response.stdout) > 4 * 1024 * 1024:
                      raise ValueError("Probe response too large")
                  value = json.loads(response.stdout)
                  (RESULTS / output).write_text(json.dumps(value, indent=2), encoding="utf-8")
                  return value
              except (OSError, ValueError, subprocess.TimeoutExpired) as error:
                  (RESULTS / output).write_text(json.dumps({"probe_error": str(error), "url": url}), encoding="utf-8")
                  return None


          def wait_ready(server, url, seconds):
              deadline = time.monotonic() + seconds
              event("appium-readiness-begin", deadline_seconds=seconds, server_pid=None if server is None else server.pid)
              while time.monotonic() < deadline:
                  if server is not None and server.poll() is not None:
                      event("appium-exited-before-ready", exit_code=server.returncode)
                      return False
                  remaining = deadline - time.monotonic()
                  status = probe_json(url, "duo-appium-status.json", timeout=min(2, remaining))
                  value = status.get("value") if isinstance(status, dict) else None
                  if isinstance(value, dict) and value.get("ready") is True:
                      event("appium-ready")
                      flush_logs()
                      return True
                  flush_logs()
                  time.sleep(min(2, max(0, deadline - time.monotonic())))
              event("appium-readiness-deadline", deadline_seconds=seconds)
              return False


          def wait_test(process, seconds):
              deadline = time.monotonic() + seconds
              next_heartbeat = time.monotonic()
              event("test-begin", deadline_seconds=seconds, test_pid=process.pid,
                    filter="FullyQualifiedName=AdaptiveShell.UITests.NavigationTests.Launch_ShowsAllTopLevelItems")
              while process.poll() is None:
                  remaining = deadline - time.monotonic()
                  if remaining <= 0:
                      event("test-deadline", deadline_seconds=seconds)
                      stop_group(process, "dotnet-test")
                      flush_logs()
                      return 124
                  if time.monotonic() >= next_heartbeat:
                      event("test-running", remaining_seconds=round(remaining, 1))
                      flush_logs()
                      next_heartbeat = time.monotonic() + 15
                  time.sleep(min(1, remaining))
              flush_logs()
              event("test-exit", exit_code=process.returncode)
              return process.returncode


          def capture(command, filename, timeout=15):
              path = RESULTS / filename
              process = None
              event("native-capture-begin", command=command, timeout_seconds=timeout)
              try:
                  with path.open("wb") as stream:
                      process = start_owned(command, stdout=stream, stderr=subprocess.STDOUT)
                      try:
                          code = process.wait(timeout=timeout)
                      except subprocess.TimeoutExpired:
                          stop_group(process, filename, grace=1)
                          code = 124
                  event("native-capture-end", file=filename, exit_code=code)
              except OSError as error:
                  path.write_text(str(error), encoding="utf-8")
                  event("native-capture-error", file=filename, error=str(error))
              finally:
                  if process is not None:
                      stop_group(process, filename, grace=0)


          def collect_native_evidence():
              RESULTS.mkdir(parents=True, exist_ok=True)
              capture(["ps", "-axo", "pid,ppid,pgid,etime,state,command"], "duo-host-processes.txt", 10)
              capture(["xcrun", "simctl", "list", "devices", "--json"], "duo-device-status.json", 10)
              udid = os.environ.get("DUO_DEVICE_UDID")
              if udid:
                  capture(["xcrun", "simctl", "spawn", udid, "launchctl", "print", "system"],
                          "duo-simulator-services.txt", 15)
                  capture(["xcrun", "simctl", "spawn", udid, "launchctl", "list"],
                          "duo-simulator-processes.txt", 10)
                  # Independently capture native simulator pixels, without waiting for Appium.
                  capture(["xcrun", "simctl", "io", udid, "screenshot", "--type=png",
                           str(RESULTS / "duo-native-startup.png")], "duo-native-screenshot-command.txt", 15)
              else:
                  event("native-device-capture-skipped", reason="DUO_DEVICE_UDID not exported")
              probe_json("http://127.0.0.1:8100/status", "duo-wda-status.json", timeout=2)


          def main():
              RESULTS.mkdir(parents=True, exist_ok=True)
              test = None
              exit_code = 2
              phase = "appium-readiness"
              try:
                  # Keep the original preceding Start Appium workflow step untouched.
                  # No server restart here: failure can expose the cross-step process path.
                  if not wait_ready(None, "http://127.0.0.1:4723/status", 60):
                      exit_code = 2
                  else:
                      phase = "filtered-test"
                      command = [
                          "dotnet", "test", "Tests/AdaptiveShell.UITests/AdaptiveShell.UITests.csproj",
                          "--no-build", "--no-restore", "--filter",
                          "FullyQualifiedName=AdaptiveShell.UITests.NavigationTests.Launch_ShowsAllTopLevelItems",
                          "--logger", "trx;LogFileName=e2e.trx", "--logger", "console;verbosity=normal",
                          "--results-directory", "TestResults", "--diag", "TestResults/duo-vstest.log",
                      ]
                      with (RESULTS / "duo-test-console.log").open("wb") as test_log:
                          test = start_owned(command, stdout=test_log, stderr=subprocess.STDOUT)
                          exit_code = wait_test(test, 300)
              except Exception as error:
                  event("diagnostic-error", phase=phase, type=type(error).__name__, error=str(error))
              finally:
                  try:
                      stop_group(test, "dotnet-test", grace=1)
                  finally:
                      # Independent finally: cleanup denial must not skip native evidence.
                      try:
                          collect_native_evidence()
                      except Exception as capture_error:
                          event("native-capture-unexpected-error", type=type(capture_error).__name__,
                                error=str(capture_error))
                  try:
                      flush_logs()
                  except Exception as log_error:
                      event("live-log-flush-error", error=str(log_error))
                  result = {"scope": "startup diagnostic only; not a release/theme quality gate",
                            "phase": phase, "exit_code": exit_code,
                            "appium_ready_budget_seconds": 60, "test_budget_seconds": 300,
                            "appium_start_path": "unchanged preceding standalone workflow step"}
                  (RESULTS / "duo-startup-diagnostic.json").write_text(json.dumps(result, indent=2), encoding="utf-8")
                  event("diagnostic-complete", **result)
              return exit_code


          if __name__ == "__main__":
              sys.exit(main())
          PY
      - name: Upload startup diagnostic evidence
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: duo-startup-diagnostic
          path: |
            TestResults
            appium.log
          if-no-files-found: warn
