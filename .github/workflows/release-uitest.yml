name: Duo complete suite preboot TestHost native preinstall diagnostic

# TEMP candidate only. Base application/tests/verifier must be public6200c2bf.
# Publish only on a separate diagnostic branch after review; never replaces full31.
# App/test workload+build stays on another free runner; the one real TestHost
# reaches OneTimeSetUp before this consumer boots the same Duo for WDA and UI.
# Replace only .github/workflows/release-uitest.yml (the registered workflow),
# plus the two reviewed TEMP Python files and the SessionHost diagnostic hook.
# Transfer code rejects all other application/test/verifier changes from6200.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  DOTNET_NOLOGO: true

jobs:
  build-duo-bundle:
    runs-on: xcode-27
    timeout-minutes: 60
    name: Produce exact SDK27.1 app and complete 12-test bundle
    outputs:
      dotnet_sdk: ${{ steps.pack.outputs.dotnet_sdk }}
      manifest_sha256: ${{ steps.pack.outputs.manifest_sha256 }}
      archive_sha256: ${{ steps.pack.outputs.archive_sha256 }}
      artifact_id: ${{ steps.bundle.outputs.artifact-id }}
      artifact_digest: ${{ steps.bundle.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Select Xcode 27.1 beta without installing or booting a simulator
        timeout-minutes: 10
        run: |
          test -d /Applications/Xcode_27.1_beta.app
          sudo xcode-select -s /Applications/Xcode_27.1_beta.app/Contents/Developer
          sudo xcodebuild -license accept
          xcodebuild -runFirstLaunch
          xcodebuild -version
          xcodebuild -showsdks
          test "$(xcrun --sdk iphonesimulator --show-sdk-version)" = "27.1"
          mkdir -p TestResults
      - name: Install the original MAUI workload on the producer only
        timeout-minutes: 15
        run: dotnet workload install maui-ios --from-rollback-file workloads.rollback.json
      - name: Build the same Duo app using SDK27.1
        timeout-minutes: 20
        run: |
          dotnet build Example/ExampleAShellApp/ExampleAShellApp.csproj --disable-build-servers -c Debug -p:TargetFrameworks=net10.0-ios26.5 -p:RuntimeIdentifier=iossimulator-arm64 -p:MtouchLink=SdkOnly -p:MtouchSdkVersion=27.1 2>&1 | tee TestResults/duo-producer-build.log
          APP="Example/ExampleAShellApp/bin/Debug/net10.0-ios26.5/iossimulator-arm64/ExampleAShellApp.app"
          SDK=$(/usr/libexec/PlistBuddy -c 'Print :DTSDKName' "$APP/Info.plist")
          test "$SDK" = "iphonesimulator27.1"
          plutil -p "$APP/Info.plist" > TestResults/duo-build-info.txt
          xcrun vtool -show-build "$APP/ExampleAShellApp" > TestResults/duo-native-build.txt
          python3 -c 'import re,pathlib; assert re.search(r"sdk\s+27\.1(?:\s|$)", pathlib.Path("TestResults/duo-native-build.txt").read_text()), "Native binary was not built with SDK 27.1"'
      - name: Build the original complete UI test assembly on the producer only
        timeout-minutes: 10
        run: dotnet build Tests/AdaptiveShell.UITests/AdaptiveShell.UITests.csproj --disable-build-servers 2>&1 | tee TestResults/duo-producer-test-build.log
      - name: Shut down producer build servers
        timeout-minutes: 2
        run: |
          python3 .github/workflows/scripts/duo-split-build-diagnostic-run.py --shutdown-build-servers
          cp TestResults/duo-build-server-shutdown.txt TestResults/duo-producer-build-server-shutdown.txt
      - name: Pack exact app/test outputs and public test package closure
        id: pack
        timeout-minutes: 10
        run: python3 .github/workflows/scripts/duo-split-build-transfer.py pack --output "$RUNNER_TEMP/duo-build-bundle"
      - name: Upload immutable build handoff
        id: bundle
        timeout-minutes: 10
        uses: actions/upload-artifact@v4
        with:
          name: duo-split-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/duo-build-bundle
          compression-level: 0
          if-no-files-found: error
      - name: Upload producer evidence even on failure
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: duo-split-producer-evidence
          path: TestResults/duo-*
          if-no-files-found: warn

  duo-startup-diagnostic:
    needs: build-duo-bundle
    runs-on: xcode-27
    timeout-minutes: 90
    name: Consume exact build and run complete 12-test Duo suite
    env:
      # Same dedicated-VM delete guard and runtime policy as the controlled D12 run.
      DUO_REMOVE_UNUSED_27_0_RUNTIME: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ needs.build-duo-bundle.outputs.dotnet_sdk }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select the original Xcode27.1 beta
        timeout-minutes: 10
        run: |
          test -d /Applications/Xcode_27.1_beta.app
          sudo xcode-select -s /Applications/Xcode_27.1_beta.app/Contents/Developer
          sudo xcodebuild -license accept
          xcodebuild -runFirstLaunch
          xcodebuild -version
          xcodebuild -showsdks
          test "$(xcrun --sdk iphonesimulator --show-sdk-version)" = "27.1"
          mkdir -p TestResults
      - name: Prepare the controlled diagnostic helper
        run: cp .github/workflows/scripts/duo-split-build-diagnostic-run.py "$RUNNER_TEMP/duo-startup-probe.py"
      - name: Download the exact same-run producer artifact by immutable ID
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build-duo-bundle.outputs.artifact_id }}
          # v4 ID downloads use the multiple-artifact path even for one ID.
          merge-multiple: true
          path: ${{ runner.temp }}/duo-build-input
      - name: Verify and restore exact app/test outputs without build or restore
        timeout-minutes: 10
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DUO_BUNDLE_ID: ${{ needs.build-duo-bundle.outputs.artifact_id }}
          DUO_BUNDLE_DIGEST: ${{ needs.build-duo-bundle.outputs.artifact_digest }}
          DUO_MANIFEST_SHA: ${{ needs.build-duo-bundle.outputs.manifest_sha256 }}
          DUO_ARCHIVE_SHA: ${{ needs.build-duo-bundle.outputs.archive_sha256 }}
          DUO_BUNDLE_NAME: duo-split-build-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python3 .github/workflows/scripts/duo-split-build-transfer.py consume --input "$RUNNER_TEMP/duo-build-input" --artifact-id "$DUO_BUNDLE_ID" --artifact-name "$DUO_BUNDLE_NAME" --artifact-digest "$DUO_BUNDLE_DIGEST" --manifest-sha256 "$DUO_MANIFEST_SHA" --archive-sha256 "$DUO_ARCHIVE_SHA"
      - name: Record health before runtime installation
        timeout-minutes: 4
        run: python3 "$RUNNER_TEMP/duo-startup-probe.py" --health before-runtime
      - name: Remove only unused preinstalled iOS27.0 runtime images (same CI resource comparison)
        if: ${{ env.DUO_REMOVE_UNUSED_27_0_RUNTIME == 'true' }}
        timeout-minutes: 8
        run: python3 "$RUNNER_TEMP/duo-startup-probe.py" --prune-unused-ios27
      - name: Disable only Spotlight indexing in this ephemeral Duo CI VM
        timeout-minutes: 2
        env:
          DUO_DIAGNOSTIC_DISABLE_SPOTLIGHT_INDEXING: 'true'
        run: python3 "$RUNNER_TEMP/duo-startup-probe.py" --disable-spotlight-indexing
      - name: Install the original exact Duo runtime
        timeout-minutes: 30
        run: xcodebuild -downloadPlatform iOS -buildVersion 24A94401 -architectureVariant arm64
      - name: Prepare and verify the original exact iPhone Duo
        timeout-minutes: 5
        run: python3 .github/workflows/scripts/prepare-duo.py --output TestResults/duo-environment.json
      # Consumer deliberately has no MAUI installation, dotnet build or dotnet restore.
      # Installed WDA still builds here for this consumer's actual Shutdown Duo UDID.
      - name: Install the original global Appium and installed XCUITest/WDA dependencies
        timeout-minutes: 10
        run: |
          npm i -g appium
          appium driver install xcuitest
          appium --version > TestResults/duo-appium-version.txt
          appium driver list --installed --json > TestResults/duo-drivers.json
          node -e 'const p=require("path"),f=require("fs"),o=require("os"); const a=process.env.APPIUM_HOME||p.join(o.homedir(),".appium"); const q=require.resolve("appium-webdriveragent/package.json",{paths:[p.join(a,"node_modules/appium-xcuitest-driver")]}); process.stdout.write(f.readFileSync(q,"utf8"));' > TestResults/duo-wda-version.json
      - name: Build installed WDA16.12.11 for the actual consumer Shutdown Duo
        timeout-minutes: 15
        run: python3 "$RUNNER_TEMP/duo-startup-probe.py" --prebuild-wda
      - name: Start the original global Appium and verify live status before boot
        timeout-minutes: 5
        run: python3 "$RUNNER_TEMP/duo-startup-probe.py" --start-appium-preboot
      - name: Record original health after WDA and Appium startup
        timeout-minutes: 4
        run: python3 "$RUNNER_TEMP/duo-startup-probe.py" --health preboot
      - name: Capture bounded resource observations immediately before boot
        timeout-minutes: 2
        run: python3 "$RUNNER_TEMP/duo-startup-probe.py" --resource-observation before-boot
      - name: Immediately upload preboot raw observations and environment
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: duo-split-preboot-environment
          path: |
            TestResults/duo-*
            appium.log
          if-no-files-found: warn
      - name: Run complete12 with exact native preinstall before TestHost release
        timeout-minutes: 25
        env:
          UITEST_PLATFORM: ios
          UITEST_FORM: duo
          UITEST_DEVICE_NAME: ${{ env.DUO_DEVICE_NAME }}
          UITEST_DEVICE_UDID: ${{ env.DUO_DEVICE_UDID }}
          UITEST_APP_PATH: ${{ github.workspace }}/Example/ExampleAShellApp/bin/Debug/net10.0-ios26.5/iossimulator-arm64/ExampleAShellApp.app
          DUO_DIAGNOSTIC_PREBOOT_HOST: 'true'
          DUO_DIAGNOSTIC_PREINSTALL_AUT: 'true'
        run: python3 "$RUNNER_TEMP/duo-startup-probe.py"
      - name: Verify the original strict raw four-phase evidence without fallback
        timeout-minutes: 2
        run: python3 .github/workflows/scripts/verify-duo-evidence.py TestResults --strict > TestResults/duo-checks.json
      - name: Capture original bounded health on failure
        if: failure()
        timeout-minutes: 2
        run: python3 "$RUNNER_TEMP/duo-startup-probe.py" --health workflow-failure
      - name: Upload all original full-suite and handoff evidence
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: duo-split-complete-evidence
          path: |
            TestResults
            appium.log
          if-no-files-found: warn
