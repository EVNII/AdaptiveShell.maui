name: Release UI Tests

# Targeted diagnostic: original iOS 27 compact cell, full unfiltered 13 tests.
# This run does not replace the complete 31-cell release gate.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  DOTNET_NOLOGO: true

jobs:
  build-ios-app:
    # 用 macos-15:macos-26 镜像当前的 workload manifest 只提供 iOS 26.0/27.0 pack,
    # 不认识 net10.0-ios26.5(NETSDK1140);macos-15 上验证过可构建
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Select latest Xcode
        run: |
          XCODE_APP="$(for app in /Applications/Xcode*.app; do realpath "$app"; done | sort -uV | tail -1)"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          sudo xcodebuild -license accept || true
          xcodebuild -runFirstLaunch
      - name: Install MAUI workloads
        run: dotnet workload install maui-ios --from-rollback-file workloads.rollback.json
      - name: Build example app (iOS)
        # runner 最新 Xcode 的 SDK 可能低于 ios26.5 pack 要求,SdkOnly 链接绕过 MT0180
        run: dotnet build Example/ExampleAShellApp/ExampleAShellApp.csproj -c Debug -p:TargetFrameworks=net10.0-ios26.5 -p:RuntimeIdentifier=iossimulator-arm64 -p:MtouchLink=SdkOnly
      - name: Zip .app
        # upload-artifact 不保留 .app 内的符号链接/权限,必须先打包
        run: ditto -c -k --sequesterRsrc --keepParent Example/ExampleAShellApp/bin/Debug/net10.0-ios26.5/iossimulator-arm64/ExampleAShellApp.app ExampleAShellApp.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: ExampleAShellApp.zip
          retention-days: 3

  prepare-ios-27:
    runs-on: xcode-27
    outputs:
      matrix: ${{ steps.devices.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: devices
        env:
          TARGET_MAJOR: '27'
        run: |
          MATRIX=$(python3 .github/workflows/scripts/discover-simulators.py "$TARGET_MAJOR")
          COMPACT_MATRIX=$(DISCOVERED_MATRIX="$MATRIX" python3 - <<'PY'
          import json, os, uuid
          matrix = json.loads(os.environ["DISCOVERED_MATRIX"])
          if not isinstance(matrix, dict) or set(matrix) != {"include"} or not isinstance(matrix["include"], list):
              raise SystemExit("iOS 27 discovery must return an include array")
          cells = matrix["include"]
          compact = [cell for cell in cells if isinstance(cell, dict) and cell.get("form") == "compact"]
          if len(compact) != 1:
              raise SystemExit(f"iOS 27 compact discovery requires exactly one cell, got {len(compact)}")
          cell = compact[0]
          if set(cell) != {"device", "udid", "form"}:
              raise SystemExit("iOS 27 compact cell has unexpected fields")
          if not isinstance(cell["device"], str) or not cell["device"].startswith("iPhone") or "Duo" in cell["device"]:
              raise SystemExit("iOS 27 compact cell must be an ordinary iPhone")
          if not isinstance(cell["udid"], str) or str(uuid.UUID(cell["udid"])).lower() != cell["udid"].lower():
              raise SystemExit("iOS 27 compact UDID must be a canonical UUID")
          if sum(isinstance(other, dict) and other.get("udid") == cell["udid"] for other in cells) != 1:
              raise SystemExit("iOS 27 compact UDID is not unique in discovery")
          print(json.dumps({"include": [cell]}, separators=(",", ":")))
          PY
          )
          echo "matrix=$COMPACT_MATRIX" >> "$GITHUB_OUTPUT"

  uitest-ios-27:
    needs: [build-ios-app, prepare-ios-27]
    runs-on: xcode-27
    # 预览镜像的设备名单动态发现,已发现的设备同样参与发布门禁。
    if: ${{ needs.prepare-ios-27.outputs.matrix != '' && needs.prepare-ios-27.outputs.matrix != '{"include":[]}' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-ios-27.outputs.matrix) }}
    name: uitest-ios (27, ${{ matrix.device }}) [experimental]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Appium
        run: |
          npm i -g appium
          appium driver install xcuitest
      - uses: actions/download-artifact@v4
        with:
          name: ios-app
          path: app
      - name: Unzip .app
        run: ditto -x -k app/ExampleAShellApp.zip app/
      - name: Boot simulator
        run: |
          xcrun simctl boot "${{ matrix.udid }}" || true
          xcrun simctl bootstatus "${{ matrix.udid }}" -b
      - name: Start Appium
        run: npx appium --keep-alive-timeout 900 > appium.log 2>&1 &
      - name: Run UI tests
        run: |
          until curl -s --max-time 2 http://127.0.0.1:4723/status >/dev/null; do sleep 2; done
          UITEST_PLATFORM=ios UITEST_FORM=${{ matrix.form }} \
          UITEST_DEVICE_NAME="${{ matrix.device }}" UITEST_DEVICE_UDID="${{ matrix.udid }}" \
          UITEST_APP_PATH="$GITHUB_WORKSPACE/app/ExampleAShellApp.app" \
            dotnet test Tests/AdaptiveShell.UITests/AdaptiveShell.UITests.csproj --logger "trx;LogFileName=e2e.trx" --results-directory TestResults
      - name: Upload shots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shots-ios27-${{ matrix.form }}-${{ matrix.device }}
          path: |
            TestResults/shots
            TestResults/screenshots
            TestResults/*.trx
            TestResults/landing-*.xml
            TestResults/landing-*.json
            appium.log
          if-no-files-found: ignore
