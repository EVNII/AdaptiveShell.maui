name: Android status-bar original and fixed E2E diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build-fixed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install MAUI Android workload
        run: dotnet workload install maui-android --from-rollback-file workloads.rollback.json
      - name: Build fixed native app
        run: dotnet build Example/ExampleAShellApp/ExampleAShellApp.csproj -c Debug -p:TargetFrameworks=net10.0-android -p:EmbedAssembliesIntoApk=true
      - uses: actions/upload-artifact@v4
        with:
          name: android-bars-fixed-apk
          path: Example/ExampleAShellApp/bin/Debug/net10.0-android/com.companyname.exampleashellapp-Signed.apk
  compare:
    needs: build-fixed
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        variant: [original, fixed]
    name: Android API36 compact (${{ matrix.variant }})
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Appium and record actual driver versions
        run: |
          npm i -g appium
          appium driver install uiautomator2
          mkdir -p TestResults
          node -e 'const p=require("path"),f=require("fs"),o=require("os"); const a=process.env.APPIUM_HOME||p.join(o.homedir(),".appium"); const d=p.join(a,"node_modules/appium-uiautomator2-driver"); const q=require.resolve("appium-android-driver/package.json",{paths:[d]}); const read=x=>JSON.parse(f.readFileSync(x,"utf8")); const u=read(p.join(d,"package.json")),n=read(q); process.stdout.write(JSON.stringify({uiautomator2:{name:u.name,version:u.version},android:{name:n.name,version:n.version,package_json:q}},null,2));' > TestResults/android-driver-versions.json
      - name: Verify original run source
        if: matrix.variant == 'original'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/EVNII/AdaptiveShell.maui/actions/runs/37035249887 --jq .head_sha)" = '6200c2bf798d3caeef8b47cda071aeb7f8607c8e'
      - name: Download exact original native APK
        if: matrix.variant == 'original'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: EVNII/AdaptiveShell.maui
          run-id: 37035249887
          name: android-apk
          path: app
      - name: Download this diagnostic fixed APK
        if: matrix.variant == 'fixed'
        uses: actions/download-artifact@v4
        with:
          name: android-bars-fixed-apk
          path: app
      - name: Record tested APK provenance
        env:
          VARIANT: ${{ matrix.variant }}
          DIAGNOSTIC_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          apk=pathlib.Path('app/com.companyname.exampleashellapp-Signed.apk')
          original=os.environ['VARIANT']=='original'
          data={'variant':os.environ['VARIANT'],'source_sha':'6200c2bf798d3caeef8b47cda071aeb7f8607c8e' if original else os.environ['DIAGNOSTIC_SHA'],'source_run':37035249887 if original else None,'apk_sha256':hashlib.sha256(apk.read_bytes()).hexdigest(),'scope':'One theme-flow comparison; not the full 31-cell release gate'}
          pathlib.Path('TestResults/android-apk-provenance.json').write_text(json.dumps(data,indent=2))
          PY
      - name: Start Appium
        run: npx appium > appium.log 2>&1 &
      - name: Run real light dark restored theme flow
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: default
          arch: x86_64
          profile: pixel_6
          cores: 4
          disable-animations: true
          script: |
            adb shell settings put global anr_show_background 0 || true
            until curl -s --max-time 2 http://127.0.0.1:4723/status >/dev/null; do sleep 2; done
            UITEST_PLATFORM=android UITEST_FORM=compact UITEST_APP_PATH="$GITHUB_WORKSPACE/app/com.companyname.exampleashellapp-Signed.apk" dotnet test Tests/AdaptiveShell.UITests/AdaptiveShell.UITests.csproj --filter FullyQualifiedName~DarkMode_ShellAndGroupFlow --logger "trx;LogFileName=e2e.trx" --results-directory TestResults
      - name: Upload original raw comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-bars-${{ matrix.variant }}
          path: |
            TestResults/shots
            TestResults/screenshots
            TestResults/*.trx
            TestResults/android-*.json
            appium.log
          if-no-files-found: error
