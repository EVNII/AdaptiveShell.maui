name: Android36 Window Background Verification
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  DOTNET_NOLOGO: true
jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install MAUI workloads
        run: dotnet workload install maui-android --from-rollback-file workloads.rollback.json
      - name: Build example app (Android)
        # EmbedAssembliesIntoApk:Debug 默认 fast-deploy 包不含程序集,装上即崩
        run: |
          python3 - <<'PYMANIFEST'
          import os,re,xml.etree.ElementTree as ET
          from pathlib import Path
          source=os.environ['GITHUB_SHA']
          assert re.fullmatch('[0-9a-f]{40}',source) and os.environ['GITHUB_WORKFLOW_SHA']==source
          original=Path('Example/ExampleAShellApp/Platforms/Android/AndroidManifest.xml')
          target=Path('TestResults/AndroidManifest.navigation-diagnostic.xml')
          target.parent.mkdir(exist_ok=True)
          assert not target.exists()
          ns='http://schemas.android.com/apk/res/android'; ET.register_namespace('android',ns)
          doc=ET.parse(original); app=doc.getroot().find('application'); assert app is not None
          for name,value in [('AShellNavigationAppearanceDiagnostic','true'),('AShellNavigationAppearanceDiagnosticSource',source)]:
              assert not any(n.get('{'+ns+'}name')==name for n in app.findall('meta-data'))
              ET.SubElement(app,'meta-data',{'{'+ns+'}name':name,'{'+ns+'}value':value})
          doc.write(target,encoding='utf-8',xml_declaration=True)
          PYMANIFEST
          dotnet build Example/ExampleAShellApp/ExampleAShellApp.csproj -c Debug -p:TargetFrameworks=net10.0-android -p:EmbedAssembliesIntoApk=true -p:AShellAndroidNavigationDiagnosticManifest=../../TestResults/AndroidManifest.navigation-diagnostic.xml
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: Example/ExampleAShellApp/bin/Debug/net10.0-android/com.companyname.exampleashellapp-Signed.apk
          retention-days: 3

  uitest-android:
    needs: build-android-apk
    runs-on: ubuntu-latest
    env:
      UITEST_ANDROID_NAV_APPEARANCE_DIAGNOSTIC: 'true'
      UITEST_DEVICE_UDID: emulator-5554
    strategy:
      fail-fast: false
      matrix:
        # Appium UiAutomator2 只支持 Android 8.0(API 26)+,23-25 无法驱动;
        # form 轴与 include 按共享 key 合并:compact->pixel_6,wide->pixel_tablet
        api: [36]
        form: [compact]
        include:
          - form: compact
            profile: pixel_6
    name: uitest-android (api${{ matrix.api }}, ${{ matrix.form }})
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Appium
        run: |
          npm i -g appium
          appium driver install uiautomator2
          mkdir -p TestResults
          node -e 'const p=require("path"),f=require("fs"),o=require("os"); const a=process.env.APPIUM_HOME||p.join(o.homedir(),".appium"); const d=p.join(a,"node_modules/appium-uiautomator2-driver"); const q=require.resolve("appium-android-driver/package.json",{paths:[d]}); const read=x=>JSON.parse(f.readFileSync(x,"utf8")); const u=read(p.join(d,"package.json")),n=read(q); process.stdout.write(JSON.stringify({uiautomator2:{name:u.name,version:u.version},android:{name:n.name,version:n.version,package_json:q}},null,2));' > TestResults/android-driver-versions.json

      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: app

      - name: Start Appium
        # 独立 step 后台启动:emulator-runner 的 script 逐行独立 sh -c,
        # 在里面起的进程会随该行 shell 退出被带走
        run: npx appium > appium.log 2>&1 &

      - name: Run UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: default
          arch: x86_64
          profile: ${{ matrix.profile }}
          # 默认 2 核时系统弹启动器 ANR 弹窗挡住无障碍树
          cores: 4
          disable-animations: true
          script: |
            adb shell settings put global anr_show_background 0 || true
            until curl -s --max-time 2 http://127.0.0.1:4723/status >/dev/null; do sleep 2; done
            UITEST_ANDROID_THEME_ROOT=${{ matrix.api == 29 && 'true' || 'false' }} UITEST_PLATFORM=android UITEST_FORM=${{ matrix.form }} UITEST_APP_PATH="$GITHUB_WORKSPACE/app/com.companyname.exampleashellapp-Signed.apk" dotnet test Tests/AdaptiveShell.UITests/AdaptiveShell.UITests.csproj --logger "trx;LogFileName=e2e.trx" --results-directory TestResults

      - name: Upload shots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shots-android-api${{ matrix.api }}-${{ matrix.form }}
          path: |
            TestResults/shots
            TestResults/screenshots
            TestResults/*.trx
            TestResults/landing-*.xml
            TestResults/landing-*.json
            TestResults/android-*.json
            TestResults/android-*.xml
            TestResults/android-navigation-appearance-*.jsonl
            TestResults/android-navigation-appearance-*.stdout
            TestResults/android-navigation-appearance-*.stderr
            appium.log
          if-no-files-found: ignore
