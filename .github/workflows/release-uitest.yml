name: Mac Button Style Diagnosis

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true

jobs:
  uitest-maccatalyst:
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        variant: [ashell-current, shell-current, ashell-exact, ashell-filled]
    name: Mac button (${{ matrix.variant }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select latest Xcode
        run: |
          XCODE_APP="$(for app in /Applications/Xcode*.app; do realpath "$app"; done | sort -uV | tail -1)"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          sudo xcodebuild -license accept || true
          xcodebuild -runFirstLaunch
      - name: Apply isolated comparison variant
        env:
          MAC_BUTTON_VARIANT: ${{ matrix.variant }}
        run: |
          python3 - <<'PYVARIANT'
          import os
          import plistlib
          from pathlib import Path
          info = Path('Example/ExampleAShellApp/Platforms/MacCatalyst/Info.plist')
          data = plistlib.loads(info.read_bytes())
          data['UIDeviceFamily'] = [6]
          info.write_bytes(plistlib.dumps(data))
          variant = os.environ['MAC_BUTTON_VARIANT']
          constants = {
              'ashell-current': '',
              'shell-current': 'MAC_BUTTON_OFFICIAL_SHELL',
              'ashell-exact': 'MAC_BUTTON_EXACT_BACKGROUND',
              'ashell-filled': 'MAC_BUTTON_FILLED',
          }
          project = Path('Example/ExampleAShellApp/ExampleAShellApp.csproj')
          text = project.read_text()
          text = text.replace('<UseMaui>true</UseMaui>', '<UseMaui>true</UseMaui>\n<DefineConstants>$(DefineConstants);' + constants[variant] + '</DefineConstants>')
          project.write_text(text)
          PYVARIANT
          sw_vers > environment.txt
          xcodebuild -version >> environment.txt
          xcrun --sdk macosx --show-sdk-version >> environment.txt
          dotnet --version >> environment.txt
          git diff > variant.diff
      - name: Install MAUI workloads
        run: dotnet workload install maui-maccatalyst --from-rollback-file workloads.rollback.json
      - name: Install Appium
        run: |
          npm i -g appium
          appium driver install mac2
      - name: Build example app (MacCatalyst)
        run: dotnet build Example/ExampleAShellApp/ExampleAShellApp.csproj -c Debug -p:TargetFrameworks=net10.0-maccatalyst26.5 -p:RuntimeIdentifier=maccatalyst-arm64
      - name: Register app with LaunchServices
        run: |
          APP="Example/ExampleAShellApp/bin/Debug/net10.0-maccatalyst26.5/maccatalyst-arm64/ExampleAShellApp.app"
          cp "$APP/Contents/Info.plist" app-info.plist
          sudo cp -R "$APP" /Applications/
          MAC_INSTALLED_APP="/Applications/ExampleAShellApp.app"
          MAC_APP_BUNDLE_ID=$(plutil -extract CFBundleIdentifier raw -o - "$MAC_INSTALLED_APP/Contents/Info.plist")
          test "$MAC_APP_BUNDLE_ID" = "com.companyname.exampleashellapp"
          /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -f "$MAC_INSTALLED_APP"
      - name: Start Appium
        run: npx appium > appium.log 2>&1 &
      - name: Run UI tests
        run: |
          until curl -s --max-time 2 http://127.0.0.1:4723/status >/dev/null; do sleep 2; done
          UITEST_PLATFORM=maccatalyst UITEST_APP_PATH="/Applications/ExampleAShellApp.app" dotnet test Tests/AdaptiveShell.UITests/AdaptiveShell.UITests.csproj --filter FullyQualifiedName~MacButtonStyleTests --logger "trx;LogFileName=e2e.trx" --results-directory TestResults
      - name: Collect native button diagnostics
        if: always()
        run: |
          mkdir -p TestResults
          for cache in "$HOME/Library/Containers/com.companyname.exampleashellapp/Data/Library/Caches" "$HOME/Library/Caches/com.companyname.exampleashellapp" "$HOME/Library/Caches"; do
            if [ -d "$cache" ]; then
              if [ -f "$cache/ashell-button-style.jsonl" ]; then
                cp "$cache/ashell-button-style.jsonl" TestResults/
              fi
            fi
          done
      - name: Upload shots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-button-${{ matrix.variant }}
          path: |
            TestResults/shots
            TestResults/screenshots
            TestResults/*.trx
            TestResults/*.xml
            TestResults/*.jsonl
            environment.txt
            variant.diff
            app-info.plist
            appium.log
          if-no-files-found: ignore
